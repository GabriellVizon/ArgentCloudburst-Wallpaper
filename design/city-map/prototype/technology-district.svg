<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Distrito Tecnológico — protótipo construtivo</title>
<desc id="desc">Recorte panorâmico de uma cidade cyberpunk em pixel art, com quarteirões, prédios, ruas, calçadas, canal lateral e ponte integrada.</desc>
<defs>
  <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#090817"/><stop offset=".58" stop-color="#17102c"/><stop offset="1" stop-color="#291542"/></linearGradient>
  <linearGradient id="ground" x2="0" y2="1"><stop stop-color="#29203b"/><stop offset="1" stop-color="#100e20"/></linearGradient>
  <linearGradient id="water" x2="0" y2="1"><stop stop-color="#17345a"/><stop offset="1" stop-color="#09182f"/></linearGradient>
  <linearGradient id="road" x2="0" y2="1"><stop stop-color="#343044"/><stop offset="1" stop-color="#191827"/></linearGradient>
  <linearGradient id="glass" x2="1" y2="1"><stop stop-color="#274768"/><stop offset=".55" stop-color="#19233e"/><stop offset="1" stop-color="#101426"/></linearGradient>
  <pattern id="pavement" width="24" height="18" patternUnits="userSpaceOnUse"><path d="M0 17.5H24M23.5 0V18" stroke="#9b80b7" stroke-opacity=".12" stroke-width="1"/></pattern>
  <pattern id="lane" width="42" height="8" patternUnits="userSpaceOnUse"><path d="M0 4h22" stroke="#b4a6d2" stroke-opacity=".65" stroke-width="2"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <g id="towerA">
    <path d="M0 0 72 -25 130 0 58 27Z" fill="#526184" stroke="#91dfff" stroke-opacity=".7"/>
    <path d="M0 0 58 27V174L0 145Z" fill="#1d2a45" stroke="#5d8bb5" stroke-opacity=".6"/>
    <path d="M58 27 130 0V145L58 174Z" fill="#111a31" stroke="#7a67a9" stroke-opacity=".55"/>
    <path d="M12 12 50 29V148L12 130Z" fill="#69c9ef" opacity=".18"/>
    <path d="M67 39 118 19M67 60 118 40M67 81 118 61M67 102 118 82M67 123 118 103" stroke="#7adfff" stroke-opacity=".52" stroke-width="4"/>
    <path d="M8 42 49 62M8 70 49 90M8 98 49 118" stroke="#b4eaff" stroke-opacity=".75" stroke-width="5"/>
    <path d="M36 -13V-48L41 -50V-11" fill="#70dfff"/><path d="M29 -42h19v4H29z" fill="#b5f1ff"/>
  </g>
  <g id="towerB">
    <path d="M0 0 58 -20 105 0 47 22Z" fill="#61406f" stroke="#f0a8ff" stroke-opacity=".7"/>
    <path d="M0 0 47 22V128L0 105Z" fill="#382344"/>
    <path d="M47 22 105 0V105L47 128Z" fill="#21182f"/>
    <path d="M9 17 39 31V103L9 88Z" fill="#f0b8ff" opacity=".62"/>
    <path d="M55 34 95 19M55 54 95 39M55 74 95 59M55 94 95 79" stroke="#d68dff" stroke-width="4" opacity=".8"/>
    <path d="M22 -8V-29h4v23" stroke="#f0b8ff" stroke-width="3"/><path d="M17 -28h14v4H17z" fill="#f0b8ff"/>
  </g>
  <g id="lowBlock">
    <path d="M0 0 66 -22 126 0 60 24Z" fill="#4b3b63" stroke="#9c7dbb" stroke-opacity=".7"/>
    <path d="M0 0 60 24V79L0 55Z" fill="#29213b"/>
    <path d="M60 24 126 0V55L60 79Z" fill="#19172d"/>
    <path d="M10 10 49 26V38L10 22ZM10 31 49 47V57L10 42Z" fill="#81dfff" opacity=".72"/>
    <path d="M69 35 115 18v8L69 43ZM69 49 115 32v8L69 57Z" fill="#d99aff" opacity=".72"/>
  </g>
</defs>
<!-- atmosphere and distant skyline -->
<rect width="1200" height="760" fill="url(#sky)"/>
<g opacity=".45" fill="#34234c">
  <path d="M0 225V155h35v-32h25v102h22V170h31v-65h28v120h22V142h38v83h26V130h24v95h28V162h31v63h28V143h38v82h28V125h34v100h25V160h28v65h28V138h38v87h28V160h34v65h25V130h32v95h25V160h42v65h24V140h34v85h26V160h38v65h25V130h35v95h28V165h35v60h28V142h38v83h30V160h32v65h40v-80h30v80h35v-60h32v60h30v-90h35v90h28v-60h34v60h35v-75h32v75h35v-45h35v45h40v-85h36v85h30v-60h35v60h20v-75h35v75h28v-55h34v55h30v-90h34v90h30v-50h35v50h40v-70h36v70h30v-40h34v40h30v-60h36v60h40v-75h36v75h30v-50h35v50h20v-90h34v90h20v535H0Z"/>
</g>
<path d="M0 238 1200 205V760H0Z" fill="url(#ground)"/>
<path d="M0 238 1200 205V760H0Z" fill="url(#pavement)" opacity=".55"/>
<!-- far blocks -->
<g opacity=".72">
  <use href="#lowBlock" transform="translate(100 290) scale(.72)"/>
  <use href="#lowBlock" transform="translate(305 280) scale(.66)"/>
  <use href="#lowBlock" transform="translate(770 270) scale(.7)"/>
  <use href="#lowBlock" transform="translate(1000 282) scale(.72)"/>
</g>
<!-- district road: broad, continuous and bounded by sidewalks -->
<path d="M-40 465 250 344 590 375 935 292 1240 365V520L935 440 590 523 250 480-40 600Z" fill="#090a17" opacity=".75"/>
<path d="M-40 438 250 318 590 348 935 265 1240 338V484L935 404 590 487 250 444-40 564Z" fill="#65517a" opacity=".55"/>
<path d="M-40 448 250 328 590 358 935 275 1240 348V468L935 388 590 471 250 428-40 548Z" fill="url(#road)" stroke="#9a70bc" stroke-opacity=".55" stroke-width="3"/>
<path d="M-20 477 250 364 590 394 935 310 1220 376" fill="none" stroke="#d1b3e8" stroke-opacity=".25" stroke-width="3"/>
<path d="M-20 516 250 402 590 432 935 349 1220 415" fill="none" stroke="#0a0b16" stroke-width="4"/>
<path d="M-20 496 250 382 590 412 935 329 1220 395" fill="none" stroke="url(#lane)" stroke-width="2"/>
<!-- sidewalks and block edges -->
<path d="M0 320 244 220 390 240 145 350Z" fill="#514064" stroke="#ad83d0" stroke-opacity=".55" stroke-width="3"/>
<path d="M0 320 244 220 390 240 145 350Z" fill="url(#pavement)"/>
<path d="M650 310 1005 220 1200 270 840 370Z" fill="#514064" stroke="#ad83d0" stroke-opacity=".55" stroke-width="3"/>
<path d="M650 310 1005 220 1200 270 840 370Z" fill="url(#pavement)"/>
<!-- technology campus buildings, all anchored on block footprints -->
<g transform="translate(70 270)"><use href="#towerA" transform="scale(.82)"/></g>
<g transform="translate(210 226)"><use href="#towerB" transform="scale(.88)"/></g>
<g transform="translate(340 253)"><use href="#towerA" transform="scale(.68)"/></g>
<g transform="translate(715 270)"><use href="#towerB" transform="scale(.8)"/></g>
<g transform="translate(845 226)"><use href="#towerA" transform="scale(.92)"/></g>
<g transform="translate(1010 250)"><use href="#towerB" transform="scale(.72)"/></g>
<!-- campus low buildings / server halls -->
<g transform="translate(435 278)"><use href="#lowBlock" transform="scale(.9)"/></g>
<g transform="translate(570 285)"><use href="#lowBlock" transform="scale(.78)"/></g>
<!-- canal is a separate lower-level corridor on the right edge -->
<path d="M1060 490 1200 450V760H1038L1080 655Z" fill="#081323"/>
<path d="M1085 485 1200 452V760H1060L1100 650Z" fill="url(#water)" stroke="#4f9dd3" stroke-width="4"/>
<path d="M1092 512 1190 484M1080 564 1194 532M1072 625 1194 592M1067 692 1195 657" stroke="#73c9f5" stroke-opacity=".45" stroke-width="3"/>
<path d="M1054 480 1077 473 1084 760 1057 760Z" fill="#6d5a7d" stroke="#c09bdc" stroke-opacity=".65" stroke-width="3"/>
<path d="M1090 475 1110 470 1118 760 1095 760Z" fill="#3b3651" opacity=".9"/>
<!-- bridge crosses the canal at road level and joins both banks -->
<path d="M900 480 1080 430 1200 456V522L1085 493 900 548Z" fill="#3e3650" stroke="#b88cdb" stroke-width="4"/>
<path d="M900 480 1080 430 1200 456" fill="none" stroke="#8de5ff" stroke-width="5" filter="url(#glow)"/>
<path d="M900 505 1082 456 1200 482" fill="none" stroke="#d6c2ed" stroke-opacity=".6" stroke-width="3"/>
<path d="M925 484 1090 440 1190 462" fill="none" stroke="#d4c5e8" stroke-width="2" stroke-dasharray="18 12"/>
<g stroke="#8ce7ff" stroke-width="4" fill="none"><path d="M930 473 930 446 1084 402 1084 430"/><path d="M930 446 1084 402 1195 427 1195 455"/></g>
<!-- small vehicles to communicate scale -->
<g transform="translate(430 403)"><path d="M0 10 24 0 52 7 28 18Z" fill="#7c5a9e"/><path d="M0 10 28 18V28L0 20Z" fill="#30233f"/><path d="M28 18 52 7V17L28 28Z" fill="#151626"/><path d="M8 10 25 4 39 8 22 14Z" fill="#9ce8ff"/></g>
<g transform="translate(690 366)"><path d="M0 10 24 0 52 7 28 18Z" fill="#9c5d9d"/><path d="M0 10 28 18V28L0 20Z" fill="#30233f"/><path d="M28 18 52 7V17L28 28Z" fill="#151626"/><path d="M8 10 25 4 39 8 22 14Z" fill="#f1b8ff"/></g>
<!-- district signage -->
<g transform="translate(420 170)">
  <path d="M0 0h330v54H0Z" fill="#0b0a1b" fill-opacity=".92" stroke="#78dfff" stroke-opacity=".8" stroke-width="2"/>
  <path d="M0 0h330" stroke="#8ce7ff" stroke-width="4" filter="url(#glow)"/>
  <text x="18" y="22" fill="#8ce7ff" font-family="monospace" font-size="11" letter-spacing="3">DISTRICT / 02</text>
  <text x="18" y="42" fill="#f2eaff" font-family="monospace" font-size="17" font-weight="bold" letter-spacing="2">DISTRITO TECNOLÓGICO</text>
</g>
<!-- navigation marker -->
<g transform="translate(590 570)">
  <ellipse rx="82" ry="18" fill="#70dfff" opacity=".12" filter="url(#glow)"/>
  <ellipse rx="52" ry="12" fill="none" stroke="#7fe4ff" stroke-width="2" stroke-dasharray="5 5"/>
  <path d="M0 -42V-12M-8 -31 0 -42 8 -31" stroke="#9ceaff" stroke-width="3" fill="none"/>
  <circle r="5" fill="#dffaff" filter="url(#glow)"/>
  <text x="0" y="36" text-anchor="middle" fill="#bceeff" font-family="monospace" font-size="12" letter-spacing="2">02 / TECH</text>
</g>
<!-- subtle framing -->
<rect x="12" y="12" width="1176" height="736" fill="none" stroke="#8f6fb0" stroke-opacity=".32" stroke-width="2"/>
<text x="30" y="724" fill="#b7a3ce" font-family="monospace" font-size="11" letter-spacing="2" opacity=".8">ARGENT CLOUDBURST / CITY CONSTRUCTION TEST</text>
</svg>